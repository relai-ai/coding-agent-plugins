name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - provenance.json
      - artifacts/**
      - copilot/**
      - plugins/**
      - .agents/**
      - .claude-plugin/**
      - .cursor-plugin/**
permissions:
  contents: write

concurrency:
  group: publish-plugin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: release
        name: Validate release
        run: python3 scripts/validate_release.py --root . --github-output "$GITHUB_OUTPUT"
      - name: Publish Copilot skills and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --generate-notes
            fi
          else
            gh skill publish copilot --tag "$tag"
          fi
      - name: Attach OpenAI submission archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          filename="$(basename "$ARCHIVE")"
          published_url="$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$filename\") | .url")"
          if [[ -n "$published_url" ]]; then
            temporary_directory="$(mktemp -d)"
            trap 'rm -rf "$temporary_directory"' EXIT
            gh release download "$tag" --pattern "$filename" --dir "$temporary_directory"
            test "$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)" = \
              "$(sha256sum "$temporary_directory/$filename" | cut -d ' ' -f 1)"
          else
            gh release upload "$tag" "$ARCHIVE"
          fi
